name: Refresh City map data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 0"

permissions:
  contents: write

concurrency:
  group: city-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and validate City data
        run: npm run data:refresh

      - name: Run project tests
        run: npm test

      - name: Publish changes when the snapshot changed
        run: |
          if git diff --quiet -- data.js; then
            echo "City data is unchanged; no deployment is needed."
            exit 0
          fi

          git config user.name "enu-map-data-bot"
          git config user.email "enu-map-data-bot@users.noreply.github.com"
          git add data.js
          git commit -m "Refresh City map data"
          git push origin main
